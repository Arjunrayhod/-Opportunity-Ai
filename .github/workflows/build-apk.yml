name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Web Assets
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Setup Gradle & Grant Permissions
        run: |
          cd android
          chmod +x gradlew

      - name: 📱 Build Android APK (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📁 Rename APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/Opportunity-AI-v1.0.apk || true

      - name: 🚀 Upload APK Artifact (Direct Download from Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Opportunity-AI-Android-APK
          path: apk_output/Opportunity-AI-v1.0.apk
          retention-days: 30

      - name: 🌟 Create / Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: Opportunity AI - Official Android APK (v1.0.0)
          body: |
            ## 🚀 Opportunity AI Official Android APK Release
            
            ### ✨ Highlights:
            - 🎯 Complete AI Opportunity Dashboard & Live Market Agent
            - 🎓 Full Courses CMS & Instant Video Player
            - 💼 Student Gigs Platform
            - 💰 Referral Wallet & Direct UPI Payment Verification
            - 🔒 Super Admin CMS Portal (`satvikbhai@opportunity.ai`)
            - 🎨 Official High-Res Opportunity AI App Icon
            
            ### 📲 How to Install on Android:
            1. Download `Opportunity-AI-v1.0.apk` below.
            2. Open the file on your Android phone and tap **Install** (Allow *Install from Unknown Sources* if prompted).
            3. Enjoy Opportunity AI!
          files: apk_output/Opportunity-AI-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
